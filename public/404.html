<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Turk Innovation</title>
    <script>
      // Preserve the full Pages URL, then let the SPA restore it after index.html loads.
      const base = "/turk-innovation/";
      const path = window.location.pathname;
      const query = window.location.search;
      const hash = window.location.hash;
      const target = base + "?p=" + encodeURIComponent(path + query + hash);
      window.location.replace(target);
    </script>
  </head>
  <body></body>
</html>
